[project]
name = "copper-vision"
version = "0.7.0"
description = "工业视觉在线检测系统 — 本地桌面版"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.32.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "opencv-python>=4.9.0",
    "Pillow>=10.2.0",
    "scikit-image>=0.22.0",
    "torch>=2.2.0",
    "ultralytics>=8.1.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "scipy>=1.12.0",
    "PySide6>=6.7.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.560.30",
    "qt-material>=2.17",
    "qtawesome>=1.3.1",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # pycodestyle syntax/runtime blockers
]
ignore = [
    "E501",              # line length handled by formatter
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "src/device/camera/hikrobot/MvImport/",
]

[tool.bandit]
exclude_dirs = ["venv", ".venv", "__pycache__", "node_modules"]
skips = ["B404"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-p", "no:cacheprovider"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
