[project]
name = "copper-vision"
version = "0.6.0"
description = "工业视觉在线检测系统 — 本地桌面版"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.32.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "opencv-python>=4.9.0",
    "Pillow>=10.2.0",
    "scikit-image>=0.22.0",
    "torch>=2.2.0",
    "ultralytics>=8.1.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "scipy>=1.12.0",
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
